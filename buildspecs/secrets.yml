# Étape Security-Scans / Secrets : Gitleaks + TruffleHog sur tout l'historique Git.
version: 0.2

env:
  shell: bash

phases:
  install:
    commands:
      - bash scripts/install-tools.sh gitleaks trufflehog
  build:
    commands:
      - bash scripts/scan-secrets.sh
  post_build:
    commands:
      - bash scripts/upload-reports.sh secrets
