# AppSpec CodeDeploy pour EC2 (blue/green via copie de l'Auto Scaling Group).
# Chaque instance "green" récupère l'image validée dans ECR et la lance avec Docker.
version: 0.0
os: linux
files:
  - source: /
    destination: /opt/devsecops-app
file_exists_behavior: OVERWRITE
hooks:
  ApplicationStop:
    - location: scripts/stop_container.sh
      timeout: 60
      runas: root
  AfterInstall:
    - location: scripts/pull_image.sh
      timeout: 300
      runas: root
  ApplicationStart:
    - location: scripts/start_container.sh
      timeout: 120
      runas: root
  ValidateService:
    - location: scripts/validate_service.sh
      timeout: 180
      runas: root
